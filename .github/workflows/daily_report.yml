name: Daily Stock AI Report

on:
  schedule:
   # 월, 화, 수, 목, 금 아침 6시에만 실행 (토, 일 제외)
    # UTC 기준으로는 일, 월, 화, 수, 목 밤 9시가 한국의 월, 화, 수, 목, 금 아침이야!
    - cron: '00 21 * * 0-4'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    # 파일 수정을 위한 권한 추가
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # google-genai 라이브러리로 수정 완료!
          pip install requests beautifulsoup4 yfinance python-dotenv google-genai

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python morning_report.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 만약 history.json 파일이 없으면 에러 방지를 위해 체크
          if [ -f history.json ]; then
            git add history.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "📅 Update report history [skip ci]" && git push)
          else
            echo "history.json 파일이 생성되지 않았습니다."
          fi
