name: Daily Stock AI Report

on:
  schedule:
    # 한국 시간(KST) 오후 14:05은 UTC 기준 05:05입니다.
    - cron: '5 5 * * *' 
  workflow_dispatch: # 이 버튼을 누르면 지금 즉시 실행됩니다!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 yfinance google-generativeai

      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python morning_report.py
