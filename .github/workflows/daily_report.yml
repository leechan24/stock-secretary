name: Daily Stock AI Report

on:
  schedule:
    # 월, 화, 수, 목, 금 아침 6시에 실행 (한국 시간 기준)
    # UTC 기준: 일, 월, 화, 수, 목 밤 9시
    - cron: '00 21 * * 0-4'
  workflow_dispatch: # 필요할 때 언제든 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    # history.json 수정을 위해 쓰기 권한 부여
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 휴장일 판단을 위한 exchange-calendars와 pandas 추가 완료!
          pip install requests beautifulsoup4 yfinance python-dotenv google-genai exchange-calendars pandas

      - name: Run Morning Report Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python morning_report.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. history.json 파일이 존재하는지 먼저 확인
          if [ -f history.json ]; then
            git add history.json
            
            # 2. 파일에 변화가 있는지 확인 (휴장일이라 변화가 없으면 커밋 스킵)
            if git diff --quiet && git diff --staged --quiet; then
              echo "아무런 변화가 없습니다. 커밋을 건너뜁니다."
            else
              git commit -m "📅 Update report history [skip ci]"
              git push
              echo "성공적으로 업데이트 및 푸시되었습니다."
            fi
          else
            echo "history.json 파일이 존재하지 않습니다."
          fi
