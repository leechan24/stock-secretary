name: Daily Stock AI Report

on:
  schedule:
    # 월, 화, 수, 목, 금 아침 6시에 실행 (한국 시간 기준)
    - cron: '00 21 * * 0-4'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 yfinance python-dotenv google-genai exchange-calendars pandas

      - name: Run Morning Report Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python morning_report.py

      # --- [추가된 단계: 성적표 계산] ---
      - name: Calculate Performance Stats
        run: python calc_stats.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. history.json과 stats.json 파일 존재 여부 확인 후 add
          if [ -f history.json ]; then
            git add history.json
            echo "history.json 파일을 스테이징에 추가했습니다."
          fi
          
          if [ -f stats.json ]; then
            git add stats.json
            echo "stats.json 파일을 스테이징에 추가했습니다."
          fi
          
          # 2. 파일 변화 확인 및 커밋/푸시
          if git diff --quiet && git diff --staged --quiet; then
            echo "아무런 변화가 없습니다. 커밋을 건너뜁니다."
          else
            git commit -m "📅 Update report & stats [skip ci]"
            git push
            echo "성공적으로 업데이트 및 푸시되었습니다."
          fi
